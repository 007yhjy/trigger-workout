<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}

nav .in{padding-bottom:env(safe-area-inset-bottom)}
#timer{margin-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
header h1{font-size:19px;font-weight:900;margin:0;letter-spacing:-.3px}

.badge{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{color:var(--up);border-color:#2b5a45}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.sel select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}
.pills{display:flex;gap:6px;margin-top:8px}
.pill{flex:1;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-weight:700;font-size:14px;position:relative}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill .dot{position:absolute;top:4px;right:6px;font-size:10px;color:var(--up)}
.pill.on .dot{color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);gap:8px}
.meta input[type=date]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
.block{margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.block .bt{font-size:13px;color:var(--accent2);font-weight:700}
.block .bt small{color:var(--muted);font-weight:500}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#5a2b2b}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exh b{font-size:16px}
.muted{color:var(--muted);font-size:12.5px}
.rec{margin:8px 0 6px;padding:8px 10px;border-radius:10px;font-size:13.5px;line-height:1.45;background:var(--panel2);border-left:3px solid var(--keep)}
.rec b{font-size:15px}
.rec small{display:block;color:var(--muted);font-size:12px}
.rec.up{border-color:var(--up)} .rec.up b{color:var(--up)}
.rec.keep b{color:var(--keep)}
.rec.phase{border-color:var(--phase)} .rec.phase b{color:var(--phase)}
.rec.new{border-color:var(--new)} .rec.new b{color:var(--new)}
.row{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.sl{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.fld{position:relative}
.fld input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 10px;font-weight:700;text-align:right}
.fld input::placeholder{color:#556070;font-weight:500}
.fld input:focus{outline:none;border-color:var(--accent)}
.fld input.need{border-color:var(--danger)!important}
.row.cur .sl{background:var(--accent);color:#fff}
.go{padding:6px 10px;font-size:12.5px;margin-left:8px;white-space:nowrap}
.go.on{background:var(--danger);border-color:var(--danger);color:#fff}
.exh .r{display:flex;align-items:center}
#tnext{display:none;background:var(--up)!important;color:#06281a!important;border-color:var(--up)!important}
.fld span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:18px;font-weight:900}
.chk.done{background:var(--up);border-color:var(--up);color:#06281a}
.prev{grid-column:2 / 5;font-size:11.5px;color:var(--muted);margin-top:-3px}

.diff.up{color:#06281a;background:var(--up)} .diff.down{color:#fff;background:var(--danger)} .diff.same{color:var(--text);background:var(--panel2)}

.row.done .fld input{border-color:#2b5a45}

.finish .btn{flex:1;padding:13px;font-size:15px}

#timer{position:fixed;left:0;right:0;bottom:62px;display:none;z-index:20}
#timer .in{max-width:640px;margin:0 auto;padding:0 10px}
#timer .box{background:#1b1f28;border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.45);position:relative;overflow:hidden}

#timer.end .box{border-color:var(--up);animation:pulse 1s infinite}
#timer.end .tt{color:var(--up)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(62,207,142,.35)}}
nav{position:fixed;bottom:0;left:0;right:0;background:#12151b;border-top:1px solid var(--line);z-index:21}
nav .in{max-width:640px;margin:0 auto;display:flex}

.set-grid label{font-size:12.5px;color:var(--muted);display:block}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#232836;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:50;display:none;max-width:90%}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
svg.spark{width:100%;height:120px;display:block;margin:6px 0 10px}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-left:4px}
</style>
</head>

function parseRoutine(t){
  const ph=[]; let p,d;
  t.trim().split('\n').forEach(l=>{
    const a=l.split('|');
    if(a[0]==='P'){p={name:a[1],days:[]};ph.push(p)}

  return ph;
}

/* 단위 변환: 저장된 모든 무게를 kg↔lb로 바꾸고 증량 단위도 맞춤 */
function convertUnits(to){
  const from=S.settings.unit; if(from===to) return false;
  const f = to==='lb' ? 2.20462 : 1/2.20462, step = to==='lb' ? 0.5 : 0.25;
  for(const k in S.sessions){ const ex=S.sessions[k].ex||{}; for(const e in ex){ (ex[e].sets||[]).forEach(s=>{ if(s && s.w!=='' && s.w!=null && +s.w>0) s.w=Math.round(+s.w*f/step)*step; }); } S.sessions[k].updatedAt=Date.now(); }
  S.settings.unit=to; Object.assign(S.settings, INC_DEFAULT[to]); S.settings._u=Date.now();
  return true;
}
function migrate(){ // v2: 기본 단위를 lb로 전환
  if(S.settings.v!==2){ convertUnits('lb'); S.settings.v=2; S.settings._u=Date.now(); return true; }
  return false;
}
try{ const raw=localStorage.getItem(LS); if(raw){ const o=JSON.parse(raw); S.settings={...DEFAULT_SETTINGS,v:undefined,...o.settings}; S.sessions=o.sessions||{}; if(migrate()) localStorage.setItem(LS, JSON.stringify(S)); } }catch(e){}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

function queueRemote(docId){ saveLocal(); }
function setSync(ok, code){

/* ===== 추천 로직 ===== */
const unit = () => S.settings.unit;
const isBig = n => /(벤치|스쿼트|바로우|바벨|OHP|힙 ?쓰러스트|친업|T-?바)/i.test(n) && !/덤벨|케이블|머신|고블릿/.test(n);
const incFor = n => isBig(n) ? +S.settings.incBig : +S.settings.incSmall;
const stepFor = n => incFor(n) || 1;
const fmt = x => (Math.round(x*100)/100).toString();
const roundTo = (x,step) => Math.round(x/step)*step;
const floorTo = (x,step) => Math.floor(x/step + 1e-9)*step;
const e1rm = (w,r) => w*(1+r/30);

function findPrev(k, curIdx){
  let best=null;
  for(const sk in S.sessions){
    const i=keyToIdx(sk); if(i>=curIdx) continue;
    const rec=S.sessions[sk].ex && S.sessions[sk].ex[k];
    if(!rec||!rec.sets||!rec.sets[0]) continue;
    const s0=rec.sets[0]; if(!(s0.r>0)) continue;
    if(!best||i>best.idx) best={idx:i, rec, sk, date:S.sessions[sk].date};
  }
  return best;
}
function recommend(ex, target, curIdx){
  const k=exKey(ex.name), inc=incFor(ex.name), step=stepFor(ex.name), u=unit();
  const prev=findPrev(k,curIdx);
  if(!prev) return {type:'new', w1:null, r1:target, prev:null,
    title:`웜업으로 무게 찾기`, msg:`기록 없음 → 웜업하며 ${target}개 겨우 가능한 무게로 본세트 시작`};
  const W=+prev.rec.sets[0].w||0, R=+prev.rec.sets[0].r, pt=+prev.rec.target||target;
  const from = labelIdx(prev.idx);
  if(W<=0){
    return {type: R>=target?'up':'keep', w1:0, r1:Math.max(R+1, Math.min(target,R+1)), prev,
      title:`맨몸 ${R+1}개+`, msg:`${from}: 맨몸 ${R}개 → 1개 더${R>=target?' (목표 달성! 중량 추가 고려)':''}`};
  }
  if(pt!==target){
    const w1=Math.max(step, floorTo(W*(1+R/30)/(1+target/30), step));
    return {type:'phase', w1, r1:target, prev, title:`${fmt(w1)}${u} × ${target}개`,
      msg:`주기 변경(목표 ${pt}→${target}개): ${from} ${fmt(W)}${u}×${R}개를 추정 1RM으로 환산`};
  }
  if(R>=target){
    const calc=e1rm(W,R)/(1+target/30);
    const jumps=Math.max(1, Math.min(2, Math.floor((calc-W)/inc + 1e-9)));
    const w1=W+jumps*inc;
    return {type:'up', w1, r1:target, prev, title:`${fmt(w1)}${u} × ${target}개`,
      msg:`${from} ${fmt(W)}${u}×${R}개 — 목표 ${target}개 달성 → +${fmt(jumps*inc)}${u} 증량${jumps>1?' (여유 있게 넘겨서 2단계)':''}`};
  }
  const r1=R+1;
  return {type:'keep', w1:W, r1, prev, title:`${fmt(W)}${u} × ${r1}개 이상`,
    msg:`${from} ${fmt(W)}${u}×${R}개 — 목표 ${target}개 미달 → 같은 무게로 1개 더${R<=target-4?' (계속 크게 모자라면 5% 감량 고려)':''}`};
}
function dropW(base, i, name){ // i: 세트 index (1,2)
  if(!(base>0)) return null;
  return Math.max(stepFor(name), roundTo(base*Math.pow(1-S.settings.drop/100, i), stepFor(name)));
}
function labelIdx(i){ const p=Math.floor(i/12), w=Math.floor(i%12/3), d=i%3; return `${p+1}기 ${w+1}주 ${DAYS_SHORT[d]}`; }

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

}

function weekDone(p,w){ return [0,1,2].every(d=>S.sessions[sKey(p,w,d)]?.done); }
function cardHTML(ex,b,idx,sess,cid){
  const k=exKey(ex.name), rec=recommend(ex,b.target,idx), u=unit();
  const cur=sess?.ex?.[k]?.sets||[];
  const prevSets=rec.prev?.rec?.sets||[];
  let h=`<div class="card" data-cid="${cid}" data-k="${k}">
    <div class="exh"><b>${esc(ex.name)}</b><span class="r"><span class="muted">${ex.sets}세트 · 목표 ${b.target}개</span><button class="btn go ${chainOn(cid)?'on':''}" data-go="${cid}">${chainOn(cid)?'⏹ 정지':`▶ 시작 ${b.rest}초×${ex.sets}`}</button></span></div>
    <div class="rec ${rec.type}">${rec.type==='new'?'🔎':rec.type==='up'?'⬆':rec.type==='phase'?'🔄':'➡'} 1세트 추천 <b>${rec.title}</b><small>${rec.msg}</small></div>`;
  for(let s=0;s<ex.sets;s++){
    const c=cur[s]||{}, pv=prevSets[s];
    const pw = s===0 && rec.w1!=null ? fmt(rec.w1) : '';   // 추천은 1세트만 (지난주 기록 기반)
    const pr = s===0 ? rec.r1 : '최대';
    const prevTxt = pv && pv.r ? `지난번 ${fmt(+pv.w||0)}${u}×${pv.r}` : '';
    const goalTxt = '';
    const pvAttr = pv && pv.r>0 ? `data-pw="${+pv.w||0}" data-pr="${+pv.r}"` : '';
    h+=`<div class="row ${c.done?'done':''} ${chainOn(cid)&&C.s===s?'cur':''}" data-s="${s}" ${pvAttr}>
      <div class="sl">${s+1}</div>
      <div class="fld"><input inputmode="decimal" data-f="w" value="${c.w??''}" placeholder="${pw}"><span>${u}</span></div>
      <div class="fld"><input inputmode="numeric" data-f="r" class="${c.done&&!(c.r>0)?'need':''}" value="${c.r??''}" placeholder="${pr}"><span>개</span></div>
      <button class="chk ${c.done?'done':''}" data-chk="1" data-rest="${b.rest}">✓</button>
      ${prevTxt?`<div class="prev">${prevTxt}<span class="dslot">${diffHTML(c.w,c.r,pv)}</span></div>`:''}
    </div>`;
  }
  return h+`</div>`;
}
/* 지난주 같은 세트 대비 볼륨(무게×횟수) ▲▼ — 맨몸(무게 0)이면 횟수로 비교 */
function diffHTML(w,r,pv){
  if(!pv || !(+pv.r>0) || !(+r>0)) return '';
  const cw = (w===''||w==null) ? (+pv.w||0) : +w, pw=+pv.w||0;
  let d, txt;
  if(cw<=0 && pw<=0){ d=+r-(+pv.r); txt = d>0?`▲ +${d}개`:d<0?`▼ ${d}개`:'= 동일'; }
  else {
    const cv=cw*(+r), pvv=pw*(+pv.r); d=Math.round((cv-pvv)*10)/10;
    const pct = pvv>0 ? Math.round(d/pvv*100) : null;
    const sign = d>0?'+':'';
    txt = d>0||d<0 ? `${d>0?'▲':'▼'} 볼륨 ${sign}${fmt(d)}${unit()}${pct!==null?` <small>(${sign}${pct}%)</small>`:''}` : '= 볼륨 동일';
  }
  return `<span class="diff ${d>0?'up':d<0?'down':'same'}">${txt}</span>`;
}
function findEx(cid){ const [bi,ei]=cid.split('_').map(Number); const {p,d}=S.settings.cur; const b=PH[p].days[d].blocks[bi]; return {b, ex:b.ex[ei]}; }
function setVal(card, s, f, v){
  const sess=curSession(true), {b,ex}=findEx(card.dataset.cid), k=card.dataset.k;
  sess.ex[k] = sess.ex[k] || {name:ex.name, target:b.target, sets:[]};
  const rec=sess.ex[k]; rec.target=b.target; rec.name=ex.name;
  while(rec.sets.length<=s) rec.sets.push({});
  rec.sets[s][f]=v; sess.updatedAt=Date.now();
  if(!sess.startedAt) sess.startedAt=Date.now();
  queueRemote('s_'+sKey(S.settings.cur.p,S.settings.cur.w,S.settings.cur.d));
}

let HIST_K=null;
function renderHist(){
  const map={};
  for(const sk in S.sessions){ const ex=S.sessions[sk].ex||{}; for(const k in ex){ const s0=ex[k].sets?.[0]; if(s0&&s0.r>0){ (map[k]=map[k]||{name:ex[k].name,rows:[]}).rows.push({idx:keyToIdx(sk),date:S.sessions[sk].date,rec:ex[k]}); } } }
  const keys=Object.keys(map).sort((a,b)=>map[b].rows.length-map[a].rows.length);
  if(!keys.length){ $('#view').innerHTML=`<h2>운동 기록</h2><div class="empty">아직 기록이 없어요.<br>운동 탭에서 세트를 체크하면 여기에 쌓입니다.</div>`; return; }
  if(!HIST_K||!map[HIST_K]) HIST_K=keys[0];
  const m=map[HIST_K]; m.rows.sort((a,b)=>a.idx-b.idx); const u=unit();
  const pts=m.rows.map(r=>({x:r.idx, y:e1rm(+r.rec.sets[0].w||0,+r.rec.sets[0].r)}));
  let h=`<h2>운동 기록</h2><div class="sel"><select id="histSel">${keys.map(k=>`<option value="${k}" ${k===HIST_K?'selected':''}>${esc(map[k].name)} (${map[k].rows.length})</option>`).join('')}</select></div>`;
  h+=`<div class="card"><div class="muted">1세트 추정 1RM 추이 (${u})</div>${spark(pts)}
    <table><tr><th>주차</th><th>날짜</th><th>1세트</th><th>2·3세트</th><th>1RM</th></tr>
    ${m.rows.slice().reverse().map(r=>{const s=r.rec.sets;return `<tr><td>${labelIdx(r.idx)}</td><td>${(r.date||'').slice(5)}</td><td><b>${fmt(+s[0].w||0)}×${s[0].r}</b></td><td class="muted">${s.slice(1).filter(x=>x&&x.r).map(x=>fmt(+x.w||0)+'×'+x.r).join(', ')}</td><td>${fmt(Math.round(e1rm(+s[0].w||0,+s[0].r)*10)/10)}</td></tr>`}).join('')}
    </table></div>`;
  $('#view').innerHTML=h;
}
function spark(pts){
  if(pts.length<2) return `<div class="muted" style="padding:14px 0">기록이 2회 이상 쌓이면 그래프가 표시됩니다.</div>`;
  const W=600,H=120,P=14; const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=x=>P+(x-x0)/((x1-x0)||1)*(W-2*P), Y=y=>H-P-(y-y0)/((y1-y0)||1)*(H-2*P);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#ff6b35" stroke-width="2.5" vector-effect="non-scaling-stroke"/>${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="#ff6b35"/>`).join('')}</svg>`;
}

    <div class="muted" style="margin-bottom:8px">기록은 이 휴대폰에 저장돼요. 이전(Claude) 버전의 기록을 옮기려면 그쪽에서 복사한 백업 코드를 여기에 붙여 넣고 복원하세요.</div>
    <button class="btn" id="bCopy">📋 백업 코드 복사</button>
    <textarea id="bTxt" placeholder="복원하려면 백업 코드를 여기에 붙여넣기"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="bLoad">복원하기</button>
    <button class="btn danger" id="bReset">전체 기록 초기화</button></div>
  </div>`;
}

/* ===== 타이머 ===== */
const T={end:0,total:0,paused:false,remain:0,label:'',active:false,warned:false,ended:false};
let AC=null;
function unlockAudio(){ try{ if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){} try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(freq,at,dur,type='sine',vol=.5){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(vol,at+.015); g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g).connect(AC.destination); o.start(at); o.stop(at+dur+.03);
}
/* 10초 전: 부드러운 두 음 '띵-동' (높은음→낮은음) */
function soundWarn(){
  if(!S.settings.sound||!AC) return;
  try{ if(AC.state==='suspended') AC.resume(); const t=AC.currentTime+.02;
    tone(1318.5,t,.45,'triangle',.7); tone(987.8,t+.38,.7,'triangle',.7); }catch(e){}
  try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}
}
/* 종료: 날카로운 상승 '삐삐삐-' 를 두 번 반복 */
function soundEnd(){
  if(!S.settings.sound||!AC) return;
  try{ if(AC.state==='suspended') AC.resume(); const t=AC.currentTime+.02;
    [0,.75].forEach(r=>{ tone(1046.5,t+r,.13,'square',.35); tone(1318.5,t+r+.16,.13,'square',.35); tone(1568,t+r+.32,.32,'square',.4); }); }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){}
}
function beep(freq=880,dur=.18,times=1,gap=.12){
  if(!S.settings.sound||!AC) return;
  try{ for(let i=0;i<times;i++){ const t=AC.currentTime+i*(dur+gap); const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=freq; o.type='sine'; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.45,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);} }catch(e){}
}
/* 세트 연속 타이머: C = {cid,k,sk,s,n,sec,name} — 세트 시간이 끝나면 자동 ✓ 후 다음 세트 타이머 즉시 시작 */
let C=null, NEXT_CID=null, PENDING_RENDER=false;
function safeRenderWork(){ // 입력 중이면 입력칸에서 벗어날 때 다시 그림 (키보드가 닫히지 않도록)
  const a=document.activeElement;
  if(a && a.tagName==='INPUT' && $('#view').contains(a)){ PENDING_RENDER=true; const card=a.closest('.card'); if(card&&C&&card.dataset.cid===C.cid){ card.querySelectorAll('.row').forEach(r=>{ const i=+r.dataset.s; r.classList.toggle('cur',i===C.s); if(i<C.s){ r.classList.add('done'); r.querySelector('.chk').classList.add('done'); } }); } return; }
  PENDING_RENDER=false; renderWork();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(PENDING_RENDER && VIEW==='work'){ const a=document.activeElement; if(!(a&&a.tagName==='INPUT')){ PENDING_RENDER=false; renderWork(); } } },50));
const chainOn = cid => !!(C && C.cid===cid && C.sk===sKey(S.settings.cur.p,S.settings.cur.w,S.settings.cur.d));
const chainLabel = () => `${C.name} · ${C.s+1}/${C.n}세트`;
function persistTimer(){ try{ localStorage.setItem(LS+'_t',JSON.stringify({end:T.end,total:T.total,label:T.label,chain:C})); }catch(e){} }
function startTimer(sec,label){
  unlockAudio();
  Object.assign(T,{total:sec,end:Date.now()+sec*1000,paused:false,label,active:true,warned:sec<=10,ended:false});
  persistTimer();
  $('#timer').style.display='block'; $('#timer').classList.remove('end'); $('#tpause').textContent='⏸'; $('#tnext').style.display='none';
  tick();
}
function stopTimer(){ T.active=false; const had=!!C; C=null; NEXT_CID=null; $('#timer').style.display='none'; try{ localStorage.removeItem(LS+'_t'); }catch(e){} if(had && VIEW==='work') renderWork(); }
function dayCids(){ const {p,d}=S.settings.cur, out=[]; PH[p].days[d].blocks.forEach((b,bi)=>b.ex.forEach((ex,ei)=>out.push(`${bi}_${ei}`))); return out; }
function firstOpenSet(cid){ const {ex}=findEx(cid), k=exKey(ex.name), sets=curSession(false)?.ex?.[k]?.sets||[]; for(let i=0;i<ex.sets;i++) if(!sets[i]?.done) return i; return 0; }
function startChain(cid, from){
  const {b,ex}=findEx(cid), c=S.settings.cur;
  C={cid, k:exKey(ex.name), sk:sKey(c.p,c.w,c.d), s:from, n:ex.sets, sec:b.rest, name:ex.name};
  NEXT_CID=null;
  startTimer(b.rest, chainLabel());
  if(VIEW==='work') renderWork();
}
function markSetDone(s){ // 현재 세트 자동 체크 (빈 무게는 추천값으로 채움)
  const sess=S.sessions[C.sk] || (S.sessions[C.sk]={ex:{},date:today(),done:false});
  const rec = sess.ex[C.k] = sess.ex[C.k] || {name:C.name, sets:[]};
  const {b}=findExIn(C.sk, C.cid); rec.target=b.target; rec.name=C.name;
  while(rec.sets.length<=s) rec.sets.push({});
  const card=document.querySelector(`.card[data-cid="${C.cid}"]`), row=card && chainOn(C.cid) ? card.querySelector(`.row[data-s="${s}"]`) : null;
  if(row){ const wI=row.querySelector('[data-f=w]'), rI=row.querySelector('[data-f=r]');
    if(wI.value===''&&wI.placeholder!==''&&!isNaN(+wI.placeholder)){ wI.value=wI.placeholder; rec.sets[s].w=+wI.placeholder; }
    if(rI.value!=='') rec.sets[s].r=+rI.value; }
  rec.sets[s].done=true; sess.updatedAt=Date.now(); if(!sess.startedAt) sess.startedAt=Date.now();
  queueRemote('s_'+C.sk);
}
function findExIn(sk,cid){ const [p,w,d]=sk.split('-').map(Number), [bi,ei]=cid.split('_').map(Number), b=PH[p].days[d].blocks[bi]; return {b, ex:b.ex[ei]}; }
function advanceChain(manual){ // 현재 세트 완료 → 다음 세트 시작 또는 운동 종료
  markSetDone(C.s);
  const missingReps = !(S.sessions[C.sk].ex[C.k].sets[C.s].r>0);
  C.s++;
  if(C.s<C.n){
    if(manual){ T.end=Date.now()+C.sec*1000; } else { T.end += C.sec*1000; }
    T.total=C.sec; T.warned=false; T.ended=false; T.label=chainLabel(); persistTimer();
    soundEnd();
    if(missingReps) toast('방금 세트 횟수를 입력해 주세요');
    return true;
  }
  // 마지막 세트 끝
  const cids=dayCids(), i=cids.indexOf(C.cid); NEXT_CID = C.sk===sKey(S.settings.cur.p,S.settings.cur.w,S.settings.cur.d) ? (cids[i+1]||null) : null;
  T.ended=true; T.label=`${C.name} 완료!`; C=null; persistTimer();
  $('#timer').classList.add('end'); soundEnd();
  if(NEXT_CID){ const {ex}=findEx(NEXT_CID); $('#tnext').style.display='inline-block'; $('#tnext').textContent=`${ex.name} ▶`; }
  return false;
}
function tick(){
  if(!T.active) return;
  // 화면이 꺼져 있던 동안 지난 세트까지 한꺼번에 처리
  let guard=0, changed=false;
  while(C && !T.paused && Date.now()>=T.end && guard++<20){ changed=true; if(!advanceChain(false)) break; }
  if(changed && VIEW==='work') safeRenderWork();
  const rem = T.paused ? T.remain : Math.max(0,(T.end-Date.now())/1000);
  const r=Math.ceil(rem), m=Math.floor(r/60), s=r%60;
  $('#ttime').textContent = T.ended ? '+'+fmtTime(Math.floor((Date.now()-T.end)/1000)) : `${m}:${String(s).padStart(2,'0')}`;
  $('#tbar').style.width = (T.ended?100:(1-rem/T.total)*100)+'%';
  const sub = C ? (C.s===C.n-1 ? '마지막 세트 · 끝나면 자동 ✓' : '세트+휴식 · 끝나면 자동 ✓ 후 다음 세트') : '휴식 중';
  $('#tlabel').innerHTML = T.ended ? (C===null&&T.label.endsWith('완료!') ? `<b>${esc(T.label)}</b><br>${NEXT_CID?'다음 운동을 시작하세요':'오늘 운동 끝! 운동 완료를 눌러 주세요'}` : `<b>휴식 끝! 다음 세트 시작</b><br>${esc(T.label)}`) : `<b>${esc(T.label)}</b><br>${T.paused?'일시정지':sub}`;
  if(!T.paused && !T.warned && rem<=10 && rem>0){ T.warned=true; soundWarn(); }
  if(!C && !T.paused && !T.ended && rem<=0){ T.ended=true; $('#timer').classList.add('end'); soundEnd(); }
}
const fmtTime = x => Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
setInterval(tick,250);
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
document.querySelectorAll('#timer [data-t]').forEach(b=>b.addEventListener('click',()=>{
  unlockAudio(); const a=b.dataset.t;
  if(a==='skip') return stopTimer();
  if(a==='next'){ const n=NEXT_CID; if(!n) return; VIEW='work'; render(); startChain(n, firstOpenSet(n)); const el=document.querySelector(`.card[data-cid="${n}"]`); el&&el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(a==='pause'){ if(T.ended) return stopTimer(); if(T.paused){ T.end=Date.now()+T.remain*1000; T.paused=false; b.textContent='⏸'; } else { T.remain=Math.max(0,(T.end-Date.now())/1000); T.paused=true; b.textContent='▶'; } persistTimer(); return tick(); }
  const delta=+a;
  if(T.ended){ T.ended=false; $('#timer').classList.remove('end'); T.end=Date.now(); }
  if(T.paused) T.remain=Math.max(0,T.remain+delta); else T.end=Math.max(Date.now()+1000,T.end+delta*1000);
  T.total=Math.max(T.total+ (delta>0?delta:0), 1); T.warned = (T.end-Date.now())/1000<=10; persistTimer(); tick();
}));
try{ const t=JSON.parse(localStorage.getItem(LS+'_t')||'null'); if(t && (t.chain || t.end>Date.now()-60000)){ Object.assign(T,{end:t.end,total:t.total,label:t.label,active:true,warned:true,ended:false}); C=t.chain||null; $('#timer').style.display='block'; } }catch(e){}

/* ===== 구글 시트 전송 (오프라인 대기열) ===== */
const OB=LS+'_outbox';
const getOutbox=()=>{ try{ return JSON.parse(localStorage.getItem(OB)||'{}'); }catch(e){ return {}; } };
const setOutbox=o=>{ try{ localStorage.setItem(OB,JSON.stringify(o)); }catch(e){} };
function buildPayload(k){
  const sess=S.sessions[k]; if(!sess) return null;
  const [p,w,d]=k.split('-').map(Number), day=PH[p].days[d], rows=[];
  day.blocks.forEach(b=>b.ex.forEach(ex=>{
    const rec=sess.ex?.[exKey(ex.name)]; if(!rec) return;
    (rec.sets||[]).forEach((s,i)=>{ if(s && s.r>0) rows.push([sess.date||'', PH[p].name, w+1, day.name, p*4+w+1, ex.name, i+1, +s.w||0, +s.r, unit(), b.target, Math.round(e1rm(+s.w||0,+s.r)*10)/10]); });
  }));
  return {token:S.settings.sheetToken||'', sessionKey:k, rows};
}
function enqueue(k){ const o=getOutbox(), pl=buildPayload(k); if(!pl) return; o[k]=pl; setOutbox(o); flushOutbox(); }
let flushing=false;
async function flushOutbox(){
  updateSyncBadge();
  const url=(S.settings.sheetUrl||'').trim();
  if(flushing || !url || !navigator.onLine) return;
  flushing=true;
  const o=getOutbox();
  for(const k of Object.keys(o)){
    try{
      await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o[k])});
      const cur=getOutbox(); if(JSON.stringify(cur[k])===JSON.stringify(o[k])) delete cur[k]; setOutbox(cur);
    }catch(e){ break; }
  }
  flushing=false; updateSyncBadge();
}
function updateSyncBadge(){
  const el=document.getElementById('sync'), n=Object.keys(getOutbox()).length;
  if(!S.settings.sheetUrl){ el.textContent='📱 이 기기에 저장'; el.className='badge'; }
  else if(n){ el.textContent=`⏳ 시트 전송 대기 ${n}`; el.className='badge'; }
  else { el.textContent='✅ 시트 동기화'; el.className='badge ok'; }
}
window.addEventListener('online', flushOutbox);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) flushOutbox(); });

/* ===== 이벤트 ===== */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2200); }
function setCur(p,w,d){ S.settings.cur={p,w,d}; S.settings._u=Date.now(); queueRemote('settings'); render(); window.scrollTo({top:0}); }
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{ VIEW=b.dataset.v; render(); window.scrollTo({top:0}); }));

$('#view').addEventListener('change',e=>{
  const t=e.target, c=S.settings.cur;
  if(t.id==='selP') return setCur(+t.value,0,0);
  if(t.id==='histSel'){ HIST_K=t.value; return renderHist(); }
  if(t.id==='sdate'){ const s=curSession(true); s.date=t.value; s.updatedAt=Date.now(); return queueRemote('s_'+sKey(c.p,c.w,c.d)); }
  if(t.id==='sUnit'){ if(convertUnits(t.value)){ Object.keys(S.sessions).forEach(k=>queueRemote('s_'+k)); queueRemote('settings'); toast(`단위를 ${t.value}로 바꾸고 기존 기록도 변환했어요`); renderSet(); } return; }
  if(t.id==='sUrl'||t.id==='sTok'){ S.settings[{sUrl:'sheetUrl',sTok:'sheetToken',sSc:'shortcutName'}[t.id]]=t.value.trim(); saveLocal(); updateSyncBadge(); toast('저장됨'); return; }
  const map={sDrop:['drop',Number],sBig:['incBig',Number],sSmall:['incSmall',Number],sAuto:['autoTimer',v=>v==='1'],sSound:['sound',v=>v==='1']};
  if(map[t.id]){ const [k,fn]=map[t.id]; S.settings[k]=fn(t.value); S.settings._u=Date.now(); queueRemote('settings'); toast('저장됨'); }
});
$('#view').addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.f) return;
  const card=t.closest('.card'), row=t.closest('.row'), s=+row.dataset.s;
  const v = t.value==='' ? '' : Number(t.value);
  setVal(card,s,t.dataset.f,v);
  if(t.dataset.f==='r' && v>0) t.classList.remove('need');
  const slot=row.querySelector('.dslot');
  if(slot && row.dataset.pr){ slot.innerHTML=diffHTML(row.querySelector('[data-f=w]').value, row.querySelector('[data-f=r]').value, {w:+row.dataset.pw, r:+row.dataset.pr}); }
});
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; unlockAudio();
  const c=S.settings.cur;
  if(t.dataset.w!=null) return setCur(c.p,+t.dataset.w,c.d);
  if(t.dataset.d!=null) return setCur(c.p,c.w,+t.dataset.d);
  if(t.dataset.go){ const cid=t.dataset.go; if(chainOn(cid)) return stopTimer(); return startChain(cid, firstOpenSet(cid)); }
  if(t.dataset.chk){
    const card=t.closest('.card'), row=t.closest('.row'), s=+row.dataset.s;
    const wI=row.querySelector('[data-f=w]'), rI=row.querySelector('[data-f=r]');
    const sess=curSession(true), cur=sess.ex[card.dataset.k]?.sets?.[s];
    if(cur?.done){ setVal(card,s,'done',false); row.classList.remove('done'); t.classList.remove('done'); return; }
    if(chainOn(card.dataset.cid) && C.s===s){ advanceChain(true); if(!C){} return renderWork(); }
    if(wI.value==='' && wI.placeholder!=='' && !isNaN(+wI.placeholder)){ wI.value=wI.placeholder; setVal(card,s,'w',+wI.placeholder); }
    if(rI.value===''){ rI.focus(); toast('횟수를 입력해 주세요'); return; }
    setVal(card,s,'done',true); row.classList.add('done'); t.classList.add('done');
    const {ex}=findEx(card.dataset.cid);
    if(S.settings.autoTimer && !C){
      const last = s===ex.sets-1;
      startTimer(+t.dataset.rest, last ? `${ex.name} 끝 → 다음 운동` : `${ex.name} ${s+2}세트 준비`);
    }
    return;
  }
  if(t.id==='btnDone'){
    const s=curSession(true); s.done=!s.done; s.updatedAt=Date.now(); queueRemote('s_'+sKey(c.p,c.w,c.d));
    if(s.done){ stopTimer(); enqueue(sKey(c.p,c.w,c.d)); toast(S.settings.sheetUrl?'수고했어요! 💪 기록을 시트로 보냈어요':'수고했어요! 💪 다음 운동으로 이동합니다'); return goNext(); }
    return render();
  }
  if(t.id==='btnNext') return goNext();
  if(t.id==='bSendAll'){ if(!S.settings.sheetUrl){ toast('먼저 시트 웹앱 URL을 입력하세요'); return; } Object.keys(S.sessions).forEach(k=>{ const pl=buildPayload(k); if(pl&&pl.rows.length){ const o=getOutbox(); o[k]=pl; setOutbox(o); } }); flushOutbox(); toast('전체 기록 전송을 시작했어요'); return; }
  if(t.id==='bSndWarn'){ unlockAudio(); return soundWarn(); }
  if(t.id==='bSndEnd'){ unlockAudio(); return soundEnd(); }
  if(t.id==='bCopy'){ const txt=JSON.stringify(S); $('#bTxt').value=txt; navigator.clipboard?.writeText(txt).then(()=>toast('백업 코드 복사됨'),()=>toast('아래 칸의 코드를 직접 복사하세요')); return; }
  if(t.id==='bLoad'){
    try{ const o=JSON.parse($('#bTxt').value); if(!o.sessions) throw 0; const keep={sheetUrl:S.settings.sheetUrl,sheetToken:S.settings.sheetToken}; S.settings={...DEFAULT_SETTINGS,...o.settings,...keep}; S.sessions=o.sessions;
      Object.keys(S.sessions).forEach(k=>{S.sessions[k].updatedAt=Date.now(); queueRemote('s_'+k);}); queueRemote('settings'); toast('복원 완료'); render(); }catch(err){ toast('백업 코드가 올바르지 않아요'); } return;
  }
  if(t.id==='bReset'){
    if(!t.dataset.armed){ t.dataset.armed='1'; t.textContent='한 번 더 누르면 모두 삭제'; setTimeout(()=>{t.dataset.armed='';t.textContent='전체 기록 초기화';},3000); return; }
    const keys=Object.keys(S.sessions); S.sessions={}; saveLocal();
    if(DB&&UID) keys.forEach(k=>DB.collection('data/users/'+UID).doc('s_'+k).delete().catch(()=>{}));
    toast('초기화했어요'); render();
  }
});
function goNext(){
  let {p,w,d}=S.settings.cur; let i=sIdx(p,w,d)+1;
  if(i>=84){ toast('28주 완주! 🎉'); return render(); }
  setCur(Math.floor(i/12), Math.floor(i%12/3), i%3);
}

render();
updateSyncBadge();
flushOutbox();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
